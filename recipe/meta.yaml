{% set name = "perl-devel-overloadinfo" %}
{% set version = "0.008" %}
{% set sha256 = "91347d3a0b9a269180a3ea0e0d43f12c55dec3ddb974642f0e19093f907543d4" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/I/IL/ILMARI/Devel-OverloadInfo-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  run_exports:
    weak:
      - {{ name }} ={{ version }}

requirements:
  build:
    - make
  host:
    - perl-test-fatal
    - perl
    - perl-mro-compat
    - perl-package-stash
  run:
    - perl

test:
  imports:
    - Devel::OverloadInfo

about:
  home: http://metacpan.org/pod/Devel-OverloadInfo
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file: LICENSE
  summary: 'introspect overloaded operators'

extra:
  recipe-maintainers:
    - xileF1337
    - conda-forge/perl-packagers
